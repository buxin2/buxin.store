<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="icon" href="assets/logo.png"><title>Products | Admin | Buxin Store</title><link rel="stylesheet" href="css/style.css"></head>
<body class="admin-body" data-admin-page="products">
<div class="admin-shell">
  <aside id="admin-sidebar" class="admin-sidebar"></aside>
  <div class="admin-stage">
    <header class="admin-topbar"><div><span class="eyebrow">CATALOGUE</span><h1>Products<span class="heading-period">.</span></h1></div><button id="add-product-top" class="btn btn-primary">＋ Add product</button></header>
    <main class="admin-main">
      <div class="admin-stats admin-stats-two"><div class="stat-card"><span>Total products</span><strong id="stat-products">0</strong></div><div class="stat-card"><span>Categories</span><strong id="stat-categories">0</strong></div></div>
      <div class="admin-panel"><div class="panel-heading"><div><h2>Product catalogue</h2><p>Products saved in this browser.</p></div><label class="search-box admin-search"><span>⌕</span><input id="admin-search" type="search" placeholder="Find a product..."></label></div><div class="table-wrap"><table class="product-table"><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Actions</th></tr></thead><tbody id="admin-product-list"></tbody></table></div><div id="admin-empty" class="empty-state hidden"><h3>No products yet</h3><p>Add your first product to start building the catalogue.</p></div></div>
    </main>
  </div>
</div>
<div id="product-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-backdrop" data-close-modal></div><div class="modal-card"><div class="modal-heading"><div><span class="eyebrow">CATALOGUE EDITOR</span><h2 id="modal-title">Add a product</h2></div><button class="modal-close" data-close-modal aria-label="Close">×</button></div><form id="product-form"><input type="hidden" id="edit-id"><div class="form-grid"><label>Product name<input id="form-name" required maxlength="90" placeholder="e.g. Arduino Uno"></label><label>Product title<input id="form-title" required maxlength="120" placeholder="Short product headline"></label><label>Price in dalasi<input id="form-price" type="number" min="0" step="1" required placeholder="0"></label><label>Category<input id="form-category" required list="category-options" placeholder="e.g. Electronics"><datalist id="category-options"></datalist></label><label class="span-two gambia-check"><input id="form-gambia" type="checkbox"> Available in The Gambia — buy today, get it today</label><label class="span-two">Product description<textarea id="form-description" rows="4" required placeholder="Describe the product..."></textarea></label><label class="span-two">Image URL<input id="form-image" type="url" placeholder="https://..."></label><label class="span-two file-label">Or upload image to Cloudinary<input id="form-image-file" type="file" accept="image/*"><small id="upload-status">Optional. Configure Cloudinary in Settings to enable uploads.</small></label></div><div class="image-preview-wrap"><img id="image-preview" alt="Product preview" class="image-preview hidden"><span id="image-preview-placeholder">Product image preview</span></div><div class="modal-actions"><button type="button" class="btn btn-outline" data-close-modal>Cancel</button><button type="submit" class="btn btn-primary">Save product</button></div></form></div></div>
<div id="toast" class="toast"></div>
<script src="js/config.js"></script><script src="js/store-data.js"></script><script src="js/products-data.js"></script><script src="js/store.js"></script><script src="js/admin.js"></script>
</body></html>
