<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="icon" href="assets/logo.png"><title>Pricing | Admin | Buxin Store</title><link rel="stylesheet" href="css/style.css"></head>
<body class="admin-body" data-admin-page="pricing">
<div class="admin-shell">
  <aside id="admin-sidebar" class="admin-sidebar"></aside>
  <div class="admin-stage">
    <header class="admin-topbar"><div><span class="eyebrow">DALASI PRICES</span><h1>Pricing<span class="heading-period">.</span></h1></div></header>
    <main class="admin-main">
      <div class="admin-panel settings-panel" id="price-settings"><div class="panel-heading"><div><h2>Price settings</h2><p>Change every dalasi price at once, or search for one product and set its price. These changes stay saved until you change them again.</p></div></div><div id="price-saved-state" class="price-saved-state"><div><span>Current multiplier</span><strong id="price-factor-display">×1</strong></div><div><span>Current add / subtract</span><strong id="price-offset-display">D0</strong></div><div><span>Last change kept</span><strong id="price-last-display">None yet</strong></div></div><form id="price-adjust-form" class="settings-form price-adjust-form"><label>Apply to all prices<select id="price-operation"><option value="multiply">Multiply by</option><option value="divide">Divide by</option><option value="subtract">Subtract dalasi</option><option value="add">Add dalasi</option></select></label><label>Amount<input id="price-amount" type="number" min="0" step="any" placeholder="2" required></label><button class="btn btn-primary" type="submit">Apply to all prices</button></form><p id="price-rule-status" class="settings-hint"></p><button id="price-reset" class="btn btn-outline btn-small" type="button">Reset all price changes</button><div class="price-single"><h3 class="price-sample-heading">Live price preview</h3><div id="price-sample-results" class="price-results"></div><label class="search-box"><span>⌕</span><input id="price-search" type="search" placeholder="Search a product to edit its price" aria-label="Search a product to edit its price"></label><div id="price-search-results" class="price-results"></div></div></div>
    </main>
  </div>
</div>
<div id="toast" class="toast"></div>
<script src="js/config.js"></script><script src="js/store-data.js"></script><script src="js/products-data.js"></script><script src="js/store.js"></script><script src="js/admin.js"></script>
</body></html>
