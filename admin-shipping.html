<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="icon" href="assets/logo.png"><title>Shipping | Admin | Buxin Store</title><link rel="stylesheet" href="css/style.css"></head>
<body class="admin-body" data-admin-page="shipping">
<div class="admin-shell">
  <aside id="admin-sidebar" class="admin-sidebar"></aside>
  <div class="admin-stage">
    <header class="admin-topbar"><div><span class="eyebrow">DELIVERY FEE</span><h1>Shipping<span class="heading-period">.</span></h1></div></header>
    <main class="admin-main">
      <div class="admin-panel settings-panel" id="shipping-settings"><div class="panel-heading"><div><h2>Shipping price</h2><p>One shipping amount for every product that is not available in The Gambia. It is added to the product price customers see. Products in The Gambia stay without shipping.</p></div></div><form id="shipping-form" class="settings-form"><label>Shipping in dalasi<input id="shipping-amount" type="number" min="0" step="1" placeholder="0" required></label><button class="btn btn-primary" type="submit">Save shipping price</button></form><p id="shipping-status" class="settings-hint"></p></div>
    </main>
  </div>
</div>
<div id="toast" class="toast"></div>
<script src="js/config.js"></script><script src="js/products-data.js"></script><script src="js/store.js"></script><script src="js/admin.js"></script>
</body></html>
